services:
    db:
        image: postgres
        volumes:
            - ./01-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
            - db_data:/var/lib/postgresql/data
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
            APP_DB_NAME: app
            DJANGO_DB_NAME: django

        restart: unless-stopped
        ports:
            - 5432:5432

    django:
        depends_on:
            - db
            - minio
        build: ../../admin
        volumes:
            - ./secrets/db_django_user:/run/secrets/db_django_user
            - ./secrets/db_django_password:/run/secrets/db_django_password
            - ./secrets/django_superuser_email:/run/secrets/django_superuser_email
            - ./secrets/django_superuser_username:/run/secrets/django_superuser_username
            - ./secrets/django_superuser_password:/run/secrets/django_superuser_password
            - ./secrets/aws_s3_access_key_id:/run/secrets/aws_s3_access_key_id
            - ./secrets/aws_s3_secret_access_key:/run/secrets/aws_s3_secret_access_key
            - ./secrets/cache_invalidate_key:/run/secrets/cache_invalidate_key
        environment:
            DB_HOST: db
            DB_PORT: 5432
            APP_DB_NAME: app
            DJANGO_DB_NAME: django
            AWS_S3_USE_SSL: false
            AWS_S3_URL_PROTOCOL: http
            AWS_S3_ENDPOINT_URL: http://host.docker.internal:9000
            AWS_STORAGE_BUCKET_NAME: bucket
            APP_SERVICE_URL: http://app:3000
        ports:
            - 8000:8000

    # External services
    minio:
        image: minio/minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ACCESS_KEY: minioadmin
            MINIO_SECRET_KEY: minioadmin
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data

    redis:
        image: redis
        ports:
            - 6379:6379
        volumes:
            - ./redis.conf:/usr/local/etc/redis/redis.conf
            - redis_data:/data
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]

    app:
        depends_on:
            - django
            - db
            - redis
        build:
            context: ../../app
            args:
                DATABASE_BUILD_DSN: "postgresql://app:app@192.168.1.92:5432/app"
                REDIS_BUILD_DSN: "redis://default:password@192.168.1.92:6379/0"
                NEXT_PUBLIC_S3_ROOT: http://192.168.1.92:9000/bucket/media
        volumes:
            - ./secrets/db_app_user:/run/secrets/db_app_user
            - ./secrets/db_app_password:/run/secrets/db_app_password
            - ./secrets/redis_user:/run/secrets/redis_user
            - ./secrets/redis_password:/run/secrets/redis_password
            - ./secrets/cache_invalidate_key:/run/secrets/cache_invalidate_key
        environment:
            DB_HOST: db
            DB_PORT: 5432
            APP_DB_NAME: app
            REDIS_HOST: redis
            REDIS_PORT: 6379
            NEXT_PUBLIC_S3_ROOT: http://192.168.1.92:9000/bucket/media
            CACHE_DEBUG: true
        ports:
            - 3000:3000

volumes:
    minio_data:
    redis_data:
    db_data:
