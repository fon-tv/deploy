configs:
    # Nginx
    nginx_conf:
        file: ./config/nginx/nginx.conf
    nginx_admin_template:
        file: ./config/nginx/templates/admin.conf.template
    nginx_app_template:
        file: ./config/nginx/templates/app.conf.template

    # PostgreSQL

    # postgresql_conf:
    #     file: ./config/postgres/postgresql.conf
    postgresql_init:
        file: ./config/postgres/init/01-init.sh

    # Redis
    redis_conf:
        file: ./config/redis/redis.conf

secrets:
    # AWS
    aws_s3_access_key_id:
        external: true
    aws_s3_secret_access_key:
        external: true

    # INTERSERVICE
    cache_invalidate_key:
        external: true

    # DB
    db_password:
        external: true
    db_app_user:
        external: true
    db_app_password:
        external: true
    db_django_user:
        external: true
    db_django_password:
        external: true

    # Redis
    redis_user:
        external: true
    redis_password:
        external: true

    # Django
    django_superuser_email:
        external: true
    django_superuser_username:
        external: true
    django_superuser_password:
        external: true

    # SSL
    cert.crt:
        external: true
    cert.key:
        external: true

volumes:
    db_data:
    redis_data:
    minio_data:

networks:
    intranet:
        external: true
