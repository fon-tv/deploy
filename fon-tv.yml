services:
    nginx:
        image: nginx:latest
        environment:
            ADMIN_SERVER_NAME: admin.fontv.clbots.ru
            APP_SERVER_NAME: app.fontv.clbots.ru

        configs:
            - source: nginx_conf
              target: /etc/nginx/nginx.conf
            - source: nginx_admin_template
              target: /etc/nginx/templates/admin.conf.template
            - source: nginx_app_template
              target: /etc/nginx/templates/app.conf.template

        secrets:
            - cert.crt
            - cert.key
        networks:
            - intranet
        ports:
            - "80:80"
            - "443:443"
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]

    db:
        image: postgres:17.2-bookworm
        environment:
            POSTGRES_DB: postgres
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD_FILE: /run/secrets/db_password
            APP_DB_NAME: fon_tv
            DJANGO_DB_NAME: fon_tv_django
        volumes:
            - db_data:/var/lib/postgresql/data
        configs:
            # - source: postgresql_conf
            #   target: /etc/postgresql.conf
            - source: postgresql_init
              target: /docker-entrypoint-initdb.d/01-init.sh
        secrets:
            - db_password
            - db_app_user
            - db_app_password
            - db_django_user
            - db_django_password
        networks:
            - intranet
        ports:
            - "5432:5432"
        command: ["postgres", "-c", "config_file=/etc/postgresql.conf"]
        healthcheck:
            test: ["CMD", "pg_isready", "-U", "root"]
            interval: 5s
            timeout: 10s
            retries: 3
        deploy:
            mode: replicated
            replicas: 1
            placement:
                constraints: [node.role == manager]

    redis:
        image: redis
        ports:
            - 6379:6379
        volumes:
            - redis_data:/data
        configs:
            - source: redis_conf
              target: /usr/local/etc/redis/redis.conf
        command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
        deploy:
            mode: replicated
            replicas: 1
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first

    minio:
        image: minio/minio
        ports:
            - "9000:9000"
            - "9001:9001"
        environment:
            MINIO_ACCESS_KEY: minioadmin
            MINIO_SECRET_KEY: minioadmin
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        deploy:
            mode: replicated
            replicas: 1
            update_config:
                parallelism: 1
                delay: 10s
                order: start-first

